<!DOCTYPE html>

<!--Login Page -->

<html>
    <head>
        <title>Login - Campus Marketplace</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <nav class="navBar">
            <a href="index.html" class="navWelcome open">Campus<br>Marketplace</a>
            <div class="navBtns">
                <a href="marketplace.html" class="navBtn">Browse</a>
                <a href="mylistings.html" class="navBtn">My Listings</a>
                <a href="shortlist.html" class="navBtn">Shortlist</a>
            </div>
        </nav>
        <div class="mainPage">
            <div class="container">
                <header class="pageHeader">
                   <h1>Campus Marketplace</h1>
                </header>
                <div class="listingArea">
                    <p>Log in to browse items for sale and your listings.</p>

                    <div>
                        <label>Email:</label>
                        <br/>
                        <input type="email" id="emailInput">
                    </div>
                    
                    <div>
                        <label>Password:</label>
                        <br/>
                        <input type="password" id="passwordInput">
                    </div>
                    <br>
                    <button class="btn btn-primary" id="signInButton">Log In</button>
                    <p id="messageArea"></p>
                </div>
            </div>
        </div>
        <script type="module" src="app.js"></script>
    </body>
</html>
